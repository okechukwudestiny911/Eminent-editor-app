<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Eminent Editor - Studio Grade Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#020617;color:#e2e8f0;display:flex;min-height:100vh}
.left{width:52%;padding:22px;border-right:1px solid #1e293b;display:flex;flex-direction:column;gap:18px;overflow-y:auto;max-height:100vh}
.right{width:48%;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0f172a,#020617)}
h1{font-size:28px;font-weight:900;background:linear-gradient(90deg,#ec4899,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.small{font-size:11px;color:#94a3b8}
.label{font-size:12px;font-weight:700;color:#cbd5e1}
.input-file{width:100%;font-size:12px;color:#94a3b8;border:1px solid #1e293b;border-radius:12px;padding:7px;background:#0f172a}
.input-file::file-selector-button{margin-right:10px;padding:7px 12px;border:0;border-radius:8px;font-size:11px;font-weight:700;background:#4f46e5;color:white;cursor:pointer}
.box{background:#0f172a99;padding:14px;border-radius:14px;border:1px solid #1e293b;display:flex;flex-direction:column;gap:8px}
.range{width:100%;accent-color:#6366f1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn-opt{padding:10px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;font-size:10px;font-weight:700;cursor:pointer}
.btn-opt.active{border-color:#6366f1;background:#1e1b4b66;color:#a5b4fc}
select{width:100%;border-radius:12px;background:#0f172a;border:1px solid #1e293b;padding:10px;font-size:12px;color:#e2e8f0}
select:focus{outline:none;border-color:#6366f1}
textarea{width:100%;border-radius:12px;background:#0f172a;border:1px solid #1e293b;padding:10px;font-size:12px;color:#e2e8f0;resize:none}
textarea:focus{outline:none;border-color:#6366f1}
.btn-main{width:100%;padding:15px;border-radius:12px;background:linear-gradient(90deg,#4f46e5,#ec4899);font-weight:800;color:white;border:0;cursor:pointer;box-shadow:0 10px 20px #4f46e54d}
.btn-main:disabled{opacity:.5}
.progress{width:100%;height:10px;background:#0f172a;border-radius:999px;border:1px solid #1e293b;overflow:hidden}
.progress-bar{height:100%;background:#4f46e5;transition:width .5s}
.preview-wrap{position:relative;width:100%;max-width:360px;aspect-ratio:9/16;background:#020617;border-radius:28px;overflow:hidden;border:4px solid #1e293b;box-shadow:0 20px 50px #000a;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:cover}
.voice-btn{padding:6px 10px;border-radius:8px;font-size:10px;font-weight:700;border:0;cursor:pointer;background:#1e293b;color:#818cf8}
.voice-btn.rec{background:#dc2626;color:white;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;background:#4f46e5;color:white}
@media(max-width:900px){body{flex-direction:column}.left,.right{width:100%}}
</style>
</head>
<body>
<div class="left">
  <div>
    <h1>Eminent Editor</h1>
    <p class="small">Studio-Grade AI Ad & Video Generator — Pro Max</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px">
    <label class="label">1. Upload HD Product Images (1 to 3 images)</label>
    <input id="imgInput" type="file" accept="image/*" multiple class="input-file"/>
    <span id="imgCount" class="small" style="color:#22c55e">✓ Sharp HD Rendering Engine Active (0 loaded)</span>
  </div>

  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label class="label">2. Video Duration (Up to 1 Minute 30s)</label>
      <span id="durBadge" class="badge">1m 30s</span>
    </div>
    <input id="durRange" type="range" min="10" max="90" step="5" value="90" class="range"/>
    <div style="display:flex;justify-content:space-between" class="small"><span>10s</span><span>45s</span><span>1:30 (Max)</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px">
    <label class="label">3. Background Audio Track (Normal 1.0x Speed)</label>
    <input id="audioInput" type="file" accept="audio/*" class="input-file"/>
    <span id="audioStatus" class="small"></span>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px">
    <label class="label">4. Video Brightness & Exposure (9 Pro Modes)</label>
    <select id="brightSelect">
      <option value="studio-bright">✨ Studio Bright (Crystal Clear High Exposure)</option>
      <option value="pro-hdr">🌟 iPhone Pro HDR Max</option>
      <option value="cinematic-glow">💡 Cinematic Warm Glow</option>
      <option value="ultra-clarity">🔍 Ultra Sharp Clarity</option>
      <option value="neon-boost">⚡ Neon Vibrant Boost</option>
      <option value="ambient-soft">🌙 Ambient Soft Balance</option>
      <option value="hyper-contrast">🔥 Hyper Contrast Pop</option>
      <option value="solar-flare">☀️ Solar Studio Lighting</option>
      <option value="pure-matte">🖤 Pure Matte Elegance</option>
    </select>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px">
    <label class="label">5. AI Camera Sensor Engine (7 Modern Options)</label>
    <select id="camSelect">
      <option value="neural-hdr">🧠 Neural HDR 5 Sensor Engine</option>
      <option value="deep-fusion">🎯 Deep Fusion AI Autofocus</option>
      <option value="cinematic-pro">🎥 Cinematic Pro 8K Stabilizer</option>
      <option value="photon-engine">⚡ Apple Photon Engine Processor</option>
      <option value="smart-depth">📐 Smart Depth Perception Matrix</option>
      <option value="speed-capture">🏎️ High-Speed Micro-Processor Capture</option>
      <option value="ai-studio-lens">💎 AI Studio Multi-Lens Processor</option>
    </select>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label class="label">6. CapCut Style Lyric Captions & Hook</label>
      <button id="voiceBtn" class="voice-btn">🎤 Voice</button>
    </div>
    <textarea id="desc" rows="3" placeholder="Type why they should buy... (Text appears word-by-word like lyric videos)"></textarea>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <label class="label">7. Professional Brand Background</label>
    <div class="grid3">
      <button data-bg="neon-vibrant" class="btn-opt active">Neon Vibrant</button>
      <button data-bg="luxury-gold" class="btn-opt">Luxury Gold</button>
      <button data-bg="cyber-blue" class="btn-opt">Cyber Blue</button>
    </div>
  </div>

  <div style="margin-top:auto;padding-top:12px;border-top:1px solid #1e293b;display:flex;flex-direction:column;gap:8px">
    <div id="progWrap" class="progress" style="display:none"><div id="progBar" class="progress-bar" style="width:0%"></div></div>
    <button id="exportBtn" class="btn-main">⚡ Generate & Download to Gallery</button>
    <div id="afterDown" style="display:none;text-align:center;font-size:11px;color:#22c55e">✓ HD Video ready — downloading...</div>
  </div>
</div>

<div class="right">
  <div class="preview-wrap">
    <canvas id="c" width="810" height="1440"></canvas>
  </div>
  <p class="small" style="margin-top:10px" id="previewLabel">HD Preview • 1m 30s • Brightness & AI Camera Active</p>
  <audio id="aud" preload="auto" style="display:none"></audio>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const imgInput=document.getElementById('imgInput'), audioInput=document.getElementById('audioInput');
const durRange=document.getElementById('durRange'), durBadge=document.getElementById('durBadge'), previewLabel=document.getElementById('previewLabel');
const brightSelect=document.getElementById('brightSelect'), camSelect=document.getElementById('camSelect');
const descInput=document.getElementById('desc'), aud=document.getElementById('aud');
const voiceBtn=document.getElementById('voiceBtn'), exportBtn=document.getElementById('exportBtn');
const imgCount=document.getElementById('imgCount'), audioStatus=document.getElementById('audioStatus');
const progWrap=document.getElementById('progWrap'), progBar=document.getElementById('progBar');

let productImages=[], imageObjs=[], selectedBackground='neon-vibrant', videoDuration=90;
let selectedBrightnessMode='studio-bright', selectedCameraMode='neural-hdr';
ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

function loadImages(urls){
  productImages=urls;
  imageObjs=urls.map(u=>{const im=new Image(); im.src=u; return im;});
  imgCount.textContent=`✓ Sharp HD Rendering Engine Active (${urls.length} loaded)`;
}
imgInput.addEventListener('change', e=>{
  const files=Array.from(e.target.files).slice(0,3);
  loadImages(files.map(f=>URL.createObjectURL(f)));
});
durRange.addEventListener('input', e=>{
  videoDuration=Number(e.target.value);
  const m=Math.floor(videoDuration/60), s=videoDuration%60;
  durBadge.textContent=`${m}m ${s}s`;
  previewLabel.textContent=`HD Preview • ${m}m ${s}s • Brightness & AI Camera Active`;
});
audioInput.addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  aud.src=url; aud.load(); aud.playbackRate=1.0;
  audioStatus.textContent='✓ Audio imported at normal 1.0x playback speed'; audioStatus.style.color='#22c55e';
});
brightSelect.addEventListener('change', e=>selectedBrightnessMode=e.target.value);
camSelect.addEventListener('change', e=>selectedCameraMode=e.target.value);
document.querySelectorAll('[data-bg]').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('[data-bg]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); selectedBackground=b.dataset.bg;
  });
});
voiceBtn.addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Speech not supported');return;}
  const rec=new SR(); rec.continuous=false; rec.interimResults=false;
  rec.onstart=()=>{voiceBtn.textContent='🔴 Listening...';voiceBtn.classList.add('rec');};
  rec.onresult=(ev)=>{descInput.value=(descInput.value+' '+ev.results[0][0].transcript).trim();};
  rec.onend=()=>{voiceBtn.textContent='🎤 Voice';voiceBtn.classList.remove('rec');};
  rec.onerror=()=>{voiceBtn.textContent='🎤 Voice';voiceBtn.classList.remove('rec');};
  rec.start();
});

function getBrightnessFilter(mode){
  switch(mode){
    case 'studio-bright': return 'brightness(1.3) contrast(1.1) saturate(1.2)';
    case 'pro-hdr': return 'brightness(1.4) contrast(1.2) saturate(1.25) drop-shadow(0 0 18px rgba(255,255,255,0.35))';
    case 'cinematic-glow': return 'brightness(1.25) saturate(1.3) sepia(0.12) contrast(1.05)';
    case 'ultra-clarity': return 'brightness(1.35) contrast(1.28) saturate(1.15)';
    case 'neon-boost': return 'brightness(1.3) contrast(1.3) saturate(1.6) hue-rotate(5deg)';
    case 'ambient-soft': return 'brightness(1.15) contrast(0.95) saturate(0.9)';
    case 'hyper-contrast': return 'brightness(1.2) contrast(1.45) saturate(1.3)';
    case 'solar-flare': return 'brightness(1.45) contrast(1.1) saturate(1.2) drop-shadow(0 0 25px rgba(255,200,50,0.4))';
    case 'pure-matte': return 'brightness(0.95) contrast(1.05) saturate(0.75)';
    default: return 'brightness(1.2) contrast(1.1)';
  }
}
function getCameraExtra(mode, frame){
  if(mode==='cinematic-pro') return Math.sin(frame*0.01)*2;
  if(mode==='speed-capture') return Math.sin(frame*0.08)*1;
  return 0;
}

let frame=0;
function render(){
  frame++; const fps=30; const totalFrames=videoDuration*fps; if(frame>totalFrames) frame=0;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const grad=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  if(selectedBackground==='neon-vibrant'){grad.addColorStop(0,'#ff007f'); grad.addColorStop(0.5,'#7928ca'); grad.addColorStop(1,'#4f46e5');}
  else if(selectedBackground==='luxury-gold'){grad.addColorStop(0,'#d4af37'); grad.addColorStop(0.5,'#111'); grad.addColorStop(1,'#333');}
  else{grad.addColorStop(0,'#06b6d4'); grad.addColorStop(1,'#3b82f6');}
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.filter=getBrightnessFilter(selectedBrightnessMode);
  const extraX=getCameraExtra(selectedCameraMode, frame);

  if(imageObjs.length>0){
    const switchInterval=fps*4;
    const idx=Math.floor(frame/switchInterval)%imageObjs.length;
    const im=imageObjs[idx];
    if(im.complete && im.naturalWidth){
      const scale=1+Math.sin(frame*0.03)*0.02;
      ctx.translate(canvas.width/2 + extraX, canvas.height/2 - 80);
      ctx.scale(scale,scale);
      ctx.drawImage(im,-280,-280,560,560);
    }
  }else{
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.roundRect(canvas.width/2-280, canvas.height/2-360,560,560,24); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Upload 1-3 HD Product Images', canvas.width/2, canvas.height/2-60);
  }
  ctx.restore();

  ctx.fillStyle='#fff'; ctx.font='bold 42px sans-serif'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.95)'; ctx.shadowBlur=28;
  const raw=descInput.value || 'Discover the ultimate breakthrough product engineered for your success - Get yours today!';
  const words=raw.split(' '); const wordIndex=Math.floor((frame/totalFrames)*words.length)%words.length;
  const start=Math.max(0,wordIndex-3), end=Math.min(words.length,start+6);
  const line=words.slice(start,end).join(' ');
  ctx.fillText(line, canvas.width/2, canvas.height-180);
  ctx.shadowBlur=0;
  requestAnimationFrame(render);
}
render();

exportBtn.addEventListener('click', async ()=>{
  if(imageObjs.length===0){alert('Upload at least 1 product image'); return;}
  progWrap.style.display='block'; progBar.style.width='20%'; exportBtn.textContent='Rendering HD Video (20%)...'; exportBtn.disabled=true;
  if(aud.src){ try{ aud.playbackRate=1.0; await aud.play(); }catch(e){} }
  setTimeout(()=>{progBar.style.width='65%'; exportBtn.textContent='Rendering HD Video (65%)...';},1200);
  const stream=canvas.captureStream(30);
  let combined=stream;
  try{
    if(aud.captureStream){
      const aS=aud.captureStream();
      if(aS.getAudioTracks().length>0){
        combined=new MediaStream([...stream.getVideoTracks(), ...aS.getAudioTracks()]);
      }
    }
  }catch(e){}
  const recorder=new MediaRecorder(combined, {mimeType:'video/webm;codecs=vp9'});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    progBar.style.width='100%'; exportBtn.textContent='⚡ Generate & Download to Gallery'; exportBtn.disabled=false; progWrap.style.display='none';
    const a=document.createElement('a'); a.href=url; a.download=`eminent-pro-ad-${videoDuration}s.webm`; document.body.appendChild(a); a.click(); a.remove();
    document.getElementById('afterDown').style.display='block';
    aud.pause(); aud.currentTime=0;
    setTimeout(()=>document.getElementById('afterDown').style.display='none',4000);
  };
  recorder.start();
  setTimeout(()=>recorder.stop(), videoDuration*1000);
});
</script>
</body>
</html>
