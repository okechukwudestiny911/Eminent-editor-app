<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Eminent Editor - CapCut Style Ad Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#020617;color:#e2e8f0;display:flex;min-height:100vh}
.left{width:50%;padding:24px;border-right:1px solid #1e293b;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.right{width:50%;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a0d}
h1{font-size:30px;font-weight:900;background:linear-gradient(90deg,#ec4899,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.small{font-size:12px;color:#94a3b8}
.label{font-size:13px;font-weight:600;color:#cbd5e1}
.input-file{width:100%;font-size:13px;color:#94a3b8;border:1px solid #1e293b;border-radius:12px;padding:8px;background:#0f172a}
.input-file::file-selector-button{margin-right:12px;padding:8px 14px;border:0;border-radius:10px;font-size:12px;font-weight:700;background:#4f46e5;color:white;cursor:pointer}
.box{background:#0f172a99;padding:16px;border-radius:16px;border:1px solid #1e293b;display:flex;flex-direction:column;gap:10px}
.range{width:100%;accent-color:#6366f1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn-opt{padding:12px;border-radius:12px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;font-size:11px;font-weight:700;cursor:pointer}
.btn-opt.active-neon{border-color:#6366f1;background:#1e1b4b66;color:#a5b4fc}
.btn-opt.active-gold{border-color:#f59e0b;background:#451a0366;color:#fcd34d}
.btn-opt.active-blue{border-color:#06b6d4;background:#08334466;color:#67e8f9}
textarea{width:100%;border-radius:12px;background:#0f172a;border:1px solid #1e293b;padding:12px;font-size:13px;color:#e2e8f0;resize:none}
textarea:focus{outline:none;border-color:#6366f1}
.btn-main{width:100%;padding:16px;border-radius:12px;background:linear-gradient(90deg,#4f46e5,#ec4899);font-weight:800;color:white;border:0;cursor:pointer;box-shadow:0 10px 20px #4f46e54d}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
.progress{width:100%;height:10px;background:#0f172a;border-radius:999px;border:1px solid #1e293b;overflow:hidden}
.progress-bar{height:100%;background:#4f46e5;transition:width .5s}
.preview-wrap{position:relative;width:100%;max-width:340px;aspect-ratio:9/16;background:#020617;border-radius:28px;overflow:hidden;border:4px solid #1e293b;box-shadow:0 20px 50px #0008;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:cover}
.voice-btn{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;border:0;cursor:pointer;background:#1e293b;color:#818cf8}
.voice-btn.rec{background:#dc2626;color:white;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media(max-width:900px){body{flex-direction:column}.left,.right{width:100%}}
</style>
</head>
<body>
<div class="left">
  <div>
    <h1>Eminent Editor</h1>
    <p class="small">CapCut-Style Automated Ad Generator - Upgraded</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <label class="label">1. Upload Product Images (1 to 3 images)</label>
    <input id="imgInput" type="file" accept="image/*" multiple class="input-file"/>
    <span id="imgCount" class="small">Selected: 0 image(s) - switches every 2s</span>
  </div>

  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label class="label">2. Choose Video Duration</label>
      <span id="durBadge" style="font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;background:#4f46e5;color:white">5 Seconds</span>
    </div>
    <input id="durRange" type="range" min="3" max="15" step="1" value="5" class="range"/>
    <div style="display:flex;justify-content:space-between" class="small"><span>3s Quick</span><span>8s Standard</span><span>15s Full Ad</span></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <label class="label">3. Background Audio Track</label>
    <input id="audioInput" type="file" accept="audio/*" class="input-file"/>
    <span id="audioStatus" class="small"></span>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label class="label">4. Dynamic Lyric Captions & Hook</label>
      <button id="voiceBtn" class="voice-btn">🎤 Voice</button>
    </div>
    <textarea id="desc" rows="3" placeholder="Type why they should buy... (animates word-by-word like lyric videos)"></textarea>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label class="label">5. Professional Brand Background</label>
    <div class="grid3">
      <button data-bg="neon-vibrant" class="btn-opt active-neon">Neon Vibrant</button>
      <button data-bg="luxury-gold" class="btn-opt">Luxury Gold</button>
      <button data-bg="cyber-blue" class="btn-opt">Cyber Blue</button>
    </div>
  </div>

  <div style="margin-top:auto;padding-top:16px;border-top:1px solid #1e293b;display:flex;flex-direction:column;gap:10px">
    <div id="progWrap" class="progress" style="display:none"><div id="progBar" class="progress-bar" style="width:0%"></div></div>
    <button id="exportBtn" class="btn-main">⚡ Generate & Download to Gallery</button>
    <div id="afterDown" style="display:none;text-align:center;font-size:12px;color:#22c55e">✓ Video ready - downloading...</div>
  </div>
</div>

<div class="right">
  <div class="preview-wrap">
    <canvas id="c" width="405" height="720"></canvas>
  </div>
  <p class="small" style="margin-top:12px" id="previewLabel">CapCut Style Dynamic Preview (5s Video)</p>
  <audio id="aud" preload="auto" style="display:none"></audio>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const imgInput=document.getElementById('imgInput'), audioInput=document.getElementById('audioInput');
const durRange=document.getElementById('durRange'), durBadge=document.getElementById('durBadge'), previewLabel=document.getElementById('previewLabel');
const descInput=document.getElementById('desc'), aud=document.getElementById('aud');
const voiceBtn=document.getElementById('voiceBtn'), exportBtn=document.getElementById('exportBtn');
const imgCount=document.getElementById('imgCount'), audioStatus=document.getElementById('audioStatus');
const progWrap=document.getElementById('progWrap'), progBar=document.getElementById('progBar');

let productImages=[], audioTrack=null, selectedBackground='neon-vibrant', videoDuration=5, isRecording=false;
let imageObjs=[];

function loadImages(urls){
  productImages=urls;
  imageObjs=urls.map(u=>{const im=new Image(); im.src=u; return im;});
  imgCount.textContent=`Selected: ${urls.length} image(s) loaded (switches every 2s)`;
}

imgInput.addEventListener('change', e=>{
  const files=Array.from(e.target.files).slice(0,3);
  const urls=files.map(f=>URL.createObjectURL(f));
  loadImages(urls);
});

durRange.addEventListener('input', e=>{
  videoDuration=Number(e.target.value);
  durBadge.textContent=videoDuration+' Seconds';
  previewLabel.textContent=`CapCut Style Dynamic Preview (${videoDuration}s Video)`;
});

audioInput.addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const url=URL.createObjectURL(file);
  audioTrack=url; aud.src=url; aud.load();
  audioStatus.textContent='✓ Audio track loaded successfully'; audioStatus.style.color='#22c55e';
});

document.querySelectorAll('[data-bg]').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('[data-bg]').forEach(x=>x.className='btn-opt');
    selectedBackground=b.dataset.bg;
    if(selectedBackground==='neon-vibrant') b.className='btn-opt active-neon';
    if(selectedBackground==='luxury-gold') b.className='btn-opt active-gold';
    if(selectedBackground==='cyber-blue') b.className='btn-opt active-blue';
  });
});

// voice
voiceBtn.addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Speech not supported'); return;}
  const rec=new SR(); rec.continuous=false; rec.interimResults=false;
  rec.onstart=()=>{isRecording=true; voiceBtn.textContent='🔴 Listening...'; voiceBtn.classList.add('rec');};
  rec.onresult=(ev)=>{descInput.value=(descInput.value+' '+ev.results[0][0].transcript).trim();};
  rec.onend=()=>{isRecording=false; voiceBtn.textContent='🎤 Voice'; voiceBtn.classList.remove('rec');};
  rec.onerror=()=>{isRecording=false; voiceBtn.textContent='🎤 Voice'; voiceBtn.classList.remove('rec');};
  rec.start();
});

// render loop
let frame=0;
function render(){
  frame++; const fps=30; const totalFrames=videoDuration*fps; if(frame>totalFrames) frame=0;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // bg
  const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  if(selectedBackground==='neon-vibrant'){g.addColorStop(0,'#ff007f'); g.addColorStop(0.5,'#7928ca'); g.addColorStop(1,'#4f46e5');}
  else if(selectedBackground==='luxury-gold'){g.addColorStop(0,'#d4af37'); g.addColorStop(0.5,'#111'); g.addColorStop(1,'#333');}
  else{g.addColorStop(0,'#06b6d4'); g.addColorStop(1,'#3b82f6');}
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);

  // image switching
  if(imageObjs.length>0){
    const switchInterval=fps*2;
    const idx=Math.floor(frame/switchInterval)%imageObjs.length;
    const im=imageObjs[idx];
    if(im.complete && im.naturalWidth){
      const scale=1+Math.sin(frame*0.05)*0.04;
      ctx.save(); ctx.translate(canvas.width/2, canvas.height/2-40); ctx.scale(scale,scale);
      // cover 260
      const w=260,h=260; ctx.drawImage(im,-w/2,-h/2,w,h);
      ctx.restore();
    }
  }else{
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.roundRect(canvas.width/2-130, canvas.height/2-170,260,260,16); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Upload 1-3 Product Images', canvas.width/2, canvas.height/2-30);
  }

  // lyric animation
  ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=12;
  ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
  const raw=descInput.value || 'Discover the ultimate product built for your daily success - Buy Now!';
  const words=raw.split(' '); const wordIndex=Math.floor((frame/totalFrames)*words.length)%words.length;
  const startWord=Math.max(0,wordIndex-2); const endWord=Math.min(words.length,startWord+5);
  let line=words.slice(startWord,endWord).join(' ');
  // highlight current word
  // draw background
  ctx.fillText(line, canvas.width/2, canvas.height-90);
  ctx.shadowBlur=0;
  requestAnimationFrame(render);
}
render();

// export - real canvas capture + audio mix
async function triggerGalleryDownload(blobUrl, filename){
  const a=document.createElement('a'); a.href=blobUrl; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
}

exportBtn.addEventListener('click', async ()=>{
  if(productImages.length===0){alert('Upload at least 1 product image first'); return;}
  progWrap.style.display='block'; progBar.style.width='25%'; exportBtn.textContent='Rendering Ad (25%)...'; exportBtn.disabled=true;
  if(audioTrack){ try{ await aud.play(); }catch(e){} }
  setTimeout(()=>{progBar.style.width='70%'; exportBtn.textContent='Rendering Ad (70%)...';},800);

  // Capture canvas stream
  const stream=canvas.captureStream(30);
  let combinedStream=stream;
  if(audioTrack && aud.captureStream){
    try{
      const audioStream=aud.captureStream ? aud.captureStream() : null;
      if(audioStream && audioStream.getAudioTracks().length>0){
        const tracks=[...stream.getVideoTracks(), ...audioStream.getAudioTracks()];
        combinedStream=new MediaStream(tracks);
      }
    }catch(e){}
  }

  const recorder=new MediaRecorder(combinedStream, {mimeType:'video/webm;codecs=vp9'});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    progBar.style.width='100%'; exportBtn.textContent='⚡ Generate & Download to Gallery'; exportBtn.disabled=false;
    progWrap.style.display='none';
    triggerGalleryDownload(url, `eminent-ad-${videoDuration}s.webm`);
    document.getElementById('afterDown').style.display='block';
    aud.pause(); aud.currentTime=0;
    setTimeout(()=>document.getElementById('afterDown').style.display='none',4000);
  };
  recorder.start();
  setTimeout(()=>{recorder.stop();}, videoDuration*1000);
});
</script>
</body>
</html>
